# Config for testing with external accumulator
storage_path = "./data"
http_port = 9000
source_path = "./examples/plugin/src/client.rs"
wasm_output_dir = "./examples/output"
epoch_duration_secs = 10
# Client-testing on host receives callbacks at this URL
client_callback_url = "http://host.docker.internal:3001/webhook"

[upstream.http]
port = 8000

[accumulator.external]
wire_format = "Protobuf"

[accumulator.external.transport.http]
# Use "mock-external" for docker, "localhost" for local dev
base_url = "http://mock-external:3000"
endpoint = "/commit"
headers = {}

[archive.file]
directory = "./archive"

[downstream.blackhole]
