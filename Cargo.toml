[workspace]
resolver = "2"
members = [
    "rootsmith",
    "types",
    "wasm-host",
    "plugin-sdk",
    "examples/plugin",
]

# Exclude no_std crates from default build (they require wasm32 target)
default-members = [
    "rootsmith",
    "types",
    "wasm-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
