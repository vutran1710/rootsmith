[package]
name = "rootsmith-wasm-host"
version = "0.1.0"
edition = "2021"
description = "WASM plugin host for rootsmith"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasmer = "4"
wasmer-compiler-cranelift = "4"
postcard = { version = "1.1.3", features = ["alloc"] }
toml = "0.8"
